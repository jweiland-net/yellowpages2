<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="main">
    <f:flashMessages/>

    <f:if condition="{denialReason}">
        <f:else>
            <formvh:render persistenceIdentifier="EXT:yellowpages2/Configuration/Form/Company.form.yaml"
                           factoryClass="JWeiland\\Yellowpages2\\Domain\\Factory\\ArrayFormFactory"
                           overrideConfiguration="{settings.overrideForm}"/>
        </f:else>
    </f:if>

    <div>
        <f:link.action action="listMyCompanies">
            {f:translate(key: 'listMyCompanies')}
        </f:link.action>
    </div>
</f:section>
</html>
