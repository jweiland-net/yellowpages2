<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="main">
    <f:flashMessages/>

    <f:if condition="{denialReason}">
        <f:else>
            <f:render partial="Company/List" arguments="{companies: companies}"/>
        </f:else>
    </f:if>

    <div>
        <f:link.action action="list"
                        controller="Company"
                        pluginName="Directory"
                        pageUid="{settings.pidOfListPage}">
            {f:translate(key: 'backToList')}
        </f:link.action>
    </div>
</f:section>
</html>
