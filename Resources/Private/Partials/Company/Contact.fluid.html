<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{company.telephone}">
    {f:translate(key: 'tx_yellowpages2_domain_model_company.telephone')}: {company.telephone}
</f:if>
<br/>

<f:if condition="{company.fax}">
    {f:translate(key: 'tx_yellowpages2_domain_model_company.fax')}: {company.fax}
</f:if>
<br/>

<f:if condition="{company.email}">
    <f:link.email title="{company.email}" email="{company.email}">E-Mail</f:link.email>
</f:if>
<br/>

<f:if condition="{company.website}">
    <f:link.external title="{company.website}" uri="{company.website}">Website</f:link.external>
</f:if>
</html>
