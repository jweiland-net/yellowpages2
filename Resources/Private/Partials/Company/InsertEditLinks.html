<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:security.ifHasRole role="{settings.userGroup}">
    <aside>
        <p class="text-end">
            <f:link.action action="perform"
                           controller="Management"
                           pluginName="Management"
                           pageUid="{settings.pidOfManagementPage}">
                <span>{f:translate(key: 'newCompany')}</span>
            </f:link.action>
        </p>
        <p class="text-end">
            <f:link.action action="listMyCompanies"
                           controller="Management"
                           pluginName="Management"
                           pageUid="{settings.pidOfManagementPage}">
                <span>{f:translate(key: 'listMyCompanies')}</span>
            </f:link.action>
        </p>
    </aside>
</f:security.ifHasRole>
</html>
