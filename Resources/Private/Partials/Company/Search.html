<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:form action="listSearchResults"
        controller="Search"
        pluginName="Search"
        name="search"
        pageUid="{settings.pidOfSearchResults}">
    <div class="mb-3">
        <label for="yellowpages2-search-category" class="form-label">{f:translate(key: 'branch')}</label>
        <f:form.select name="category"
                       id="yellowpages2-search-category"
                       class="form-select"
                       options="{categories}"
                       value="{category}"
                       optionValueField="uid"
                       optionLabelField="title"
                       prependOptionLabel="{f:translate(key: 'allBranches')}"
                       prependOptionValue="0"/>
    </div>

    <div class="mb-3">
        <label for="yellowpages2-search-term" class="form-label">{f:translate(key: 'search')}</label>
        <f:form.textfield name="search"
                          id="yellowpages2-search-term"
                          class="form-control"
                          value="{f:format.htmlentitiesDecode(value: search)}"/>
    </div>

    <div class="mb-3">
        <f:form.submit class="btn btn-primary" value="{f:translate(key: 'search')}"/>
    </div>
</f:form>
</html>
